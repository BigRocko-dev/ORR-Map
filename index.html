=====================================================================================
 SETUP (one time, about 10 minutes, free)

 This file works as soon as you open it, but until you paste your Firebase settings
 below it only saves in your own browser ("demo mode"). To share live data with
 everyone who opens the page:

 1. Go to https://console.firebase.google.com and click "Add project". Any name
    (for example orr-map). You can turn Google Analytics off.
 2. In the project, open Build > Firestore Database > Create database. Pick a
    location near you and start in production mode.
 3. Open Build > Authentication > Get started > Sign-in method > Anonymous > Enable.
 4. In Firestore, open the Rules tab, replace everything with the rules below, and
    click Publish:

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{collection}/{doc} {
              allow read, write: if request.auth != null;
            }
          }
        }

 5. Open Project settings (gear icon) > General > Your apps > the </> Web icon.
    Register the app (skip Hosting). Copy the firebaseConfig values it shows you
    into ORR_FIREBASE_CONFIG just below.
 6. Upload this one file to any web host (GitHub Pages, Netlify Drop, your own site)
    and share the address. Anyone with the link can view and edit.

 Note: these rules let anyone who has the link make changes. That matches
 "anyone with the link can edit". Use Export in the Map section for backups.

<style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>ORR Management Map</h1>
      <div class="sub">Plantings, drawdowns, blinds, equipment and results, mapped by unit and kept year after year</div>
    </div>
    <nav class="years" id="years" aria-label="Year"></nav>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"><button class="btn" data-tab="map" aria-pressed="true">Map</button><button class="btn" data-tab="todo" aria-pressed="false">To-Do</button><button class="btn" data-tab="equip" aria-pressed="false">Equipment</button><button class="btn" data-tab="notes" aria-pressed="false">Notes</button><button class="btn" data-tab="harvest" aria-pressed="false">Harvest</button></nav>
  <div class="main" id="viewMap">
    <div class="stage" id="stage">
      <div id="map" aria-label="Property map"></div>
      <div class="ov tools" id="tools"></div>
      <div class="ov hint" id="hint" hidden></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
  <div class="page" id="viewTodo" hidden></div>
  <div class="page" id="viewEquip" hidden></div>
  <div class="page" id="viewNotes" hidden></div>
  <div class="page" id="viewHarvest" hidden></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
"use strict";
const ACTS = {
  disk:     {name:"Disk",     c:"#e8893a", ph:"Implement, depth, passes"},
  mow:      {name:"Mow",      c:"#9ad24a", ph:"Equipment, height"},
  burn:     {name:"Burn",     c:"#e5483a", ph:"Fuel, wind, crew"},
  drawdown: {name:"Drawdown", c:"#4aa3ea", ph:"Target level, rate, board changes"},
  plant:    {name:"Plant",    c:"#f2c744", ph:"Species, seeding rate, method"},
  pump:     {name:"Pump",     c:"#2ec4b6", ph:"Pump, hours, gauge reading"},
  spray:    {name:"Spray",    c:"#d96ad0", ph:"Product, rate, target species"},
  blind:    {name:"Blind",    c:"#c08a5a", ph:"Blind type, location notes, who set it"}
};
const CATS={equipment:"Equipment upkeep",planting:"Planting",water:"Water",spray:"Spraying",other:"Other"};
const ACT_CAT={plant:"planting",spray:"spray",pump:"water",drawdown:"water"};
const KINDS = {poly:"Area", line:"Line", point:"Point"};
const NOW = new Date();
const S = {
  mode:"local", cfg:null, units:[], marks:[], reminders:[], equipment:[], maint:[], tab:"map", harvest:[], hvAll:false, notes:[], noteTag:"", noteQ:"", noteAll:false, pe:null, confirm:null, showDone:false, eqAll:null, year:NOW.getFullYear(), extraYears:[],
  tool:"select", draft:null, editor:null, sel:null, hidden:new Set(), lastAct:"disk", busy:false
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => NOW.getFullYear()+"-"+String(NOW.getMonth()+1).padStart(2,"0")+"-"+String(NOW.getDate()).padStart(2,"0");
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

/* ---------- storage adapters ---------- */
const cfgFB = window.ORR_FIREBASE_CONFIG||{};
const fbReady = cfgFB.apiKey && !/^PASTE/.test(cfgFB.apiKey) && window.firebase;
const toDb = pts => pts.map(p=>({lat:p[0],lng:p[1]}));
const fromDb = pts => (pts||[]).map(p=>[p.lat,p.lng]);

const Local = {
  key:"orr-map-v1", subs:{},
  read(){try{return JSON.parse(localStorage.getItem(this.key)||"{}")}catch(e){return {}}},
  write(o){try{localStorage.setItem(this.key,JSON.stringify(o))}catch(e){toast("Could not save in this browser")}},
  fire(c){const d=this.read()[c]||{};(this.subs[c]||[]).forEach(f=>f(Object.keys(d).map(id=>Object.assign({id},d[id]))))},
  async init(){window.addEventListener("storage",e=>{if(e.key===this.key)Object.keys(this.subs).forEach(c=>this.fire(c))})},
  watch(c,cb){(this.subs[c]=this.subs[c]||[]).push(cb);setTimeout(()=>this.fire(c),0)},
  async set(c,id,data){const o=this.read();(o[c]=o[c]||{})[id]=data;this.write(o);this.fire(c)},
  async del(c,id){const o=this.read();if(o[c])delete o[c][id];this.write(o);this.fire(c)},
  newId(){return "d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
};
const Cloud = {
  db:null,
  async init(){
    firebase.initializeApp(cfgFB);
    await firebase.auth().signInAnonymously();
    this.db=firebase.firestore();
  },
  watch(c,cb){
    this.db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),
      e=>{console.error(e);toast("Live updates stopped: "+(e.code||e.message))});
  },
  set(c,id,data){return this.db.collection(c).doc(id).set(data)},
  del(c,id){return this.db.collection(c).doc(id).delete()},
  newId(){return this.db.collection("marks").doc().id}
};
let store=Local;

/* ---------- geometry ---------- */
const M_LAT=111320;
function proj(p,lat0){return [p[1]*M_LAT*Math.cos(lat0*Math.PI/180),p[0]*M_LAT]}
function areaAc(pts){
  if(pts.length<3) return 0;
  const lat0=pts[0][0], q=pts.map(p=>proj(p,lat0)); let a=0;
  for(let i=0;i<q.length;i++){const n=q[(i+1)%q.length];a+=q[i][0]*n[1]-n[0]*q[i][1]}
  return Math.abs(a)/2/4046.8564224;
}
function lengthFt(pts){let m=0;for(let i=1;i<pts.length;i++)m+=L.latLng(pts[i-1]).distanceTo(L.latLng(pts[i]));return m*3.28084}
function centroid(p){let a=0,b=0;p.forEach(q=>{a+=q[0];b+=q[1]});return [a/p.length,b/p.length]}
function inPoly(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){
  if(((p[i][1]>pt[1])!==(p[j][1]>pt[1]))&&(pt[0]<(p[j][0]-p[i][0])*(pt[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c}return c}
function measure(m){
  if(m.kind==="poly"){const ac=areaAc(m.points);return {txt:ac.toFixed(ac<10?2:1)+" ac",ac}}
  if(m.kind==="line"){return {txt:Math.round(lengthFt(m.points)).toLocaleString()+" ft",ac:0}}
  return {txt:"",ac:0};
}
function unitAt(points){const c=centroid(points);const u=S.units.find(u=>inPoly(c,u.points));return u?u.id:""}

/* Best spot for a label: the point inside the shape farthest from its edges. */
function labelPoint(pts){
  const lat0=pts[0][0], k=Math.cos(lat0*Math.PI/180);
  const q=pts.map(p=>[p[1]*k,p[0]]);
  const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const segD=(px,py,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)};
  let best=null,bd=-1;
  const N=28;
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){
    const px=x0+(x1-x0)*i/N, py=y0+(y1-y0)*j/N;
    if(!inPoly([py,px/k],pts)) continue;
    let d=1e9; for(let n=0;n<q.length;n++) d=Math.min(d,segD(px,py,q[n],q[(n+1)%q.length]));
    if(d>bd){bd=d;best=[py,px/k]}
  }
  return best||centroid(pts);
}

const dayDiff=due=>!due?9999:Math.round((new Date(due+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/864e5);
function dueText(r){const d=dayDiff(r.due);return d<0?"Overdue "+(-d)+(d===-1?" day":" days"):d===0?"Due today":d===1?"Due tomorrow":d<=14?"Due in "+d+" days":r.due}
function remindersCard(){
  const open=S.reminders.filter(r=>!r.done).sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0);
  const over=open.filter(r=>r.due&&dayDiff(r.due)<0).length;
  let h='<section class="card"><h2>To-Do <small>'+(over?over+" overdue · ":"")+open.length+' open</small></h2>';

  else h+='<div class="list">'+open.slice(0,4).map(r=>todoItem(r,false)).join("")+'</div>'+(open.length>4?'<p class="note">+ '+(open.length-4)+' more on the To-Do tab</p>':"");
  return h+'<div class="actions"><button class="btn" data-h="addrem">Add task</button><button class="btn" data-h="todotab">Open To-Do</button></div></section>';
}
function unitHistory(id){
  const ms=S.marks.filter(m=>m.unit===id).sort((a,b)=>b.year-a.year||((b.date||"")<(a.date||"")?-1:1));
  if(!ms.length) return '<p class="note">No entries in this unit yet.</p>';

    h+='<div class="hr"><i style="background:'+a.c+'"></i><span>'+esc(a.name)+(m.detail?" - "+esc(m.detail):"")+(m.result?'<small>Result: '+esc(m.result)+'</small>':"")+'</span><span class="n">'+esc(m.date||"")+'</span></div>';
  });

function exportIcs(){
  const open=S.reminders.filter(r=>!r.done&&r.due);
  const ymd=x=>x.replace(/-/g,""), stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const t=x=>String(x).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ORR Management Map//EN"];
  open.forEach(r=>lines.push("BEGIN:VEVENT","UID:"+r.id+"@orr-map","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(r.due),
    "SUMMARY:"+t(r.title+(unitName(r.unit)?" ("+unitName(r.unit)+")":"")),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+t(r.title),"TRIGGER:PT9H","END:VALARM","END:VEVENT"));
  lines.push("END:VCALENDAR");
  const url=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/calendar"}));
  const an=document.createElement("a");an.href=url;an.download="orr-reminders.ics";document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

const DEF_SPECIES=["Mallard","Teal","Pintail","Gadwall","Wigeon","Shoveler","Wood Duck","Canada Goose"];
const WIND_DIRS=["Calm","N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const nowTime=()=>String(NOW.getHours()).padStart(2,"0")+":"+String(NOW.getMinutes()).padStart(2,"0");
const fmtTime=t=>{if(!t)return "";const [h,m]=t.split(":").map(Number);return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM")};
function speciesList(){
  const extra=new Set();
  S.harvest.forEach(h=>(h.birds||[]).forEach(b=>{if(b.species&&!DEF_SPECIES.includes(b.species))extra.add(b.species)}));
  return DEF_SPECIES.concat([...extra].sort());
}
function blindNames(){
  const n=new Set();
  S.marks.filter(m=>m.activity==="blind"&&m.detail).forEach(m=>n.add(m.detail.trim()));
  S.harvest.forEach(h=>{if(h.blind)n.add(h.blind)});
  return [...n].sort();
}
const hvWeather=h=>[h.temp!==""&&h.temp!=null?h.temp+"°F":"",(h.windDir&&h.windDir!=="")?(h.windDir==="Calm"?"Calm":h.windDir+(h.windSpeed!==""&&h.windSpeed!=null?" "+h.windSpeed+" mph":"")):(h.windSpeed!==""&&h.windSpeed!=null?h.windSpeed+" mph wind":"")].filter(Boolean).join(" · ");

function renderHarvest(){

      '<small>'+esc([x.hunters!==""&&x.hunters!=null?x.hunters+(Number(x.hunters)===1?" hunter":" hunters"):"",w].filter(Boolean).join(" · "))+'</small>'+(x.notes?'<small>'+esc(x.notes)+'</small>':"")+'</span>'+
      '<span class="tot">'+tot(x)+'<small>birds</small></span></button>'}).join("")+'</div>'
    :'<p class="empty">'+(S.harvest.length?"No hunts in "+S.year+". Switch to all years to see earlier seasons.":"No hunts logged yet. Tap Log a hunt to record the date, conditions, blind, hunters and birds taken.")+'</p>')+'</section>';

function pageClick(e){

  const re=e.target.closest("[data-redit]"); if(re){openTodoForm(re.dataset.redit);return}
  const ne=e.target.closest("[data-nedit]"); if(ne){const n=S.notes.find(x=>x.id===ne.dataset.nedit);if(n){S.pe={type:"note",id:n.id,data:{date:n.date||"",tag:n.tag||"other",title:n.title||"",unit:n.unit||"",text:n.text||""}};renderPage();window.scrollTo({top:0,behavior:"smooth"})}return}
  const he=e.target.closest("[data-hedit]"); if(he){const x=S.harvest.find(v=>v.id===he.dataset.hedit);if(x){S.pe={type:"hunt",id:x.id,data:{date:x.date||"",time:x.time||"",temp:x.temp==null?"":x.temp,windDir:x.windDir||"",windSpeed:x.windSpeed==null?"":x.windSpeed,blind:x.blind||"",hunters:x.hunters==null?"":x.hunters,notes:x.notes||"",birds:(x.birds||[]).map(b=>({species:b.species,qty:b.qty,custom:false}))}};renderPage();window.scrollTo({top:0,behavior:"smooth"})}return}
  const h=e.target.closest("[data-h]"); if(h){mapAction(h.dataset.h);return}
  const b=e.target.closest("[data-p]"); if(!b) return;
  const a=b.dataset.p, id=b.dataset.id, focusFirst=()=>{const f=document.querySelector("#pf input");if(f)f.focus()};
  if(a==="cancel"){S.pe=null;renderPage()}
  else if(a==="newhunt"){S.pe={type:"hunt",id:null,data:{date:todayStr(),time:nowTime(),temp:"",windDir:"",windSpeed:"",blind:"",hunters:"",notes:"",birds:[{species:"",qty:"",custom:false}]}};renderPage()}
  else if(a==="hvall"){S.hvAll=!S.hvAll;renderPage()}
  else if(a==="addbird"&&S.pe&&S.pe.type==="hunt"){S.pe.data.birds.push({species:"",qty:"",custom:false});renderPage()}
  else if(a==="rmbird"&&S.pe&&S.pe.type==="hunt"){S.pe.data.birds.splice(+id,1);renderPage()}
  else if(a==="newnote"){S.pe={type:"note",id:null,data:{date:todayStr(),tag:"other",title:"",unit:"",text:""}};renderPage();const f=document.querySelector('#pf [data-k=text]');if(f)f.focus()}
  else if(a==="noteall"){S.noteAll=!S.noteAll;renderPage()}
  else if(a==="showdone"){S.showDone=!S.showDone;renderPage()}
  else if(a==="neweq"){S.pe={type:"equip",id:null,data:{name:"",type:"Tractor",hours:"",notes:""}};renderPage();focusFirst()}
  else if(a==="eqedit"){const q=S.equipment.find(x=>x.id===id);if(q){S.pe={type:"equip",id,data:{name:q.name||"",type:q.type||"Other",hours:q.hours==null?"":q.hours,notes:q.notes||""}};renderPage();focusFirst()}}
  else if(a==="log"||a==="use"){S.pe={type:"maint",equipId:id,kind:a==="use"?"use":"service",data:{date:todayStr(),hours:"",desc:"",cost:"",next:""}};renderPage();const f=document.querySelector('#pf [data-k=desc]');if(f)f.focus()}
  else if(a==="eqall"){S.eqAll=S.eqAll===id?null:id;renderPage()}
  else if(a==="mdel"){
    if(S.confirm===id) guard(async()=>{await store.del("maintenance",id);S.confirm=null;toast("Entry deleted")});
    else{S.confirm=id;renderPage()}
  }
  else if(a==="del"){
    const pe=S.pe; if(!pe||!pe.id) return;
    guard(async()=>{
      if(pe.type==="todo") await store.del("reminders",pe.id);
      else if(pe.type==="note") await store.del("notes",pe.id);
      else if(pe.type==="hunt") await store.del("harvest",pe.id);
      else if(pe.type==="equip"){for(const m of S.maint.filter(m=>m.equipId===pe.id)) await store.del("maintenance",m.id); await store.del("equipment",pe.id)}
      S.pe=null;renderPage();toast("Deleted");
    });
  }
}
function pageSubmit(e){
  e.preventDefault(); const pe=S.pe; if(!pe) return; const d=pe.data;
  guard(async()=>{
    if(pe.type==="todo"){
      const t=(d.title||"").trim(); if(!t){toast("Say what needs doing");return}
      const old=(pe.id&&S.reminders.find(x=>x.id===pe.id))||{};
      await store.set("reminders",pe.id||store.newId(),todoRec(Object.assign({},old,d,{title:t})));
      S.pe=null;renderPage();toast("Task saved");
    }else if(pe.type==="hunt"){
      if(!d.date){toast("Pick the hunt date");return}
      const birds=d.birds.map(b=>({species:(b.species||"").trim(),qty:Math.max(0,parseInt(b.qty,10)||0)})).filter(b=>b.species&&b.qty>0);
      if(d.birds.some(b=>b.custom&&!(b.species||"").trim()&&parseInt(b.qty,10)>0)){toast("Type the new species name");return}
      await store.set("harvest",pe.id||store.newId(),{date:d.date,time:d.time||"",temp:num(d.temp),windDir:d.windDir||"",windSpeed:num(d.windSpeed),blind:(d.blind||"").trim(),hunters:num(d.hunters),birds,total:birds.reduce((a,b)=>a+b.qty,0),notes:d.notes||""});
      S.pe=null;renderPage();toast("Hunt saved");
    }else if(pe.type==="note"){
      if(!(d.text||"").trim()&&!(d.title||"").trim()){toast("Write something in the note");return}
      await store.set("notes",pe.id||store.newId(),{date:d.date||todayStr(),tag:d.tag||"other",title:(d.title||"").trim(),unit:d.unit||"",text:d.text||""});
      S.pe=null;renderPage();toast("Note saved");
    }else if(pe.type==="equip"){
      const n=(d.name||"").trim(); if(!n){toast("Give the equipment a name");return}
      await store.set("equipment",pe.id||store.newId(),{name:n,type:d.type||"Other",hours:num(d.hours),notes:d.notes||""});
      S.pe=null;renderPage();toast("Equipment saved");
    }else if(pe.type==="maint"){
      const q=S.equipment.find(x=>x.id===pe.equipId); if(!q) return;
      if(!(d.desc||"").trim()&&!d.hours){toast("Add what was done or the hours");return}
      const use=pe.kind==="use", hrs=num(d.hours);
      await store.set("maintenance",store.newId(),{equipId:q.id,kind:pe.kind,date:d.date||todayStr(),hours:hrs,desc:(d.desc||"").trim(),cost:use?null:num(d.cost)});
      if(hrs!=null){
        const total=use?(Number(q.hours)||0)+hrs:Math.max(Number(q.hours)||0,hrs);
        await store.set("equipment",q.id,{name:q.name,type:q.type||"Other",hours:total,notes:q.notes||""});
      }
      if(!use&&d.next) await store.set("reminders",store.newId(),todoRec({title:"Service "+q.name+((d.desc||"").trim()?": "+d.desc.trim():""),due:d.next,cat:"equipment",equipId:q.id}));
      S.pe=null;renderPage();toast("Entry saved");
    }
  });
}
["viewTodo","viewEquip","viewNotes","viewHarvest"].forEach(id=>{
  const el=$(id);
  el.addEventListener("click",pageClick);
  el.addEventListener("submit",pageSubmit);
  el.addEventListener("input",ev=>{
    if(ev.target.id==="noteQ"){S.noteQ=ev.target.value;renderNoteList();return}
    if(ev.target.id==="noteTag"){S.noteTag=ev.target.value;renderNoteList();return}
    const bi=ev.target.dataset&&ev.target.dataset.bi;
    if(bi!==undefined&&S.pe&&S.pe.type==="hunt"){
      const row=S.pe.data.birds[+bi], bk=ev.target.dataset.bk, v=ev.target.value; if(!row) return;
      if(bk==="sel"){ if(v==="__new__"){row.custom=true;row.species="";renderPage();const f=document.querySelector('#pf [data-bi="'+bi+'"][data-bk=species]');if(f)f.focus()} else{row.custom=false;row.species=v} }
      else if(bk==="species") row.species=v;
      else if(bk==="qty") row.qty=v;
      return;
    }
    const k=ev.target.dataset&&ev.target.dataset.k;if(S.pe&&k)S.pe.data[k]=ev.target.value});
});

/* ---------- drawing ---------- */
function setTool(t){
  S.tool=t;S.draft=null;cursor=null;
  if(t!=="select"){S.sel=null;S.editor=null;S.draft={t:t==="unit"?"unit":"mark",kind:t==="unit"?"poly":t,points:[]}}
  renderTools();renderHint();renderMap();renderPanel();
}
function endDraw(){S.tool="select";S.draft=null;cursor=null;renderTools();renderHint();renderMap()}
function finishDraft(){
  const d=S.draft; if(!d) return;
  if(d.t==="unit"){
    if(d.points.length<3) return;
    S.editor={type:"unit",points:d.points.slice(),data:{name:""}};
  }else{
    const need=d.kind==="line"?2:d.kind==="poly"?3:1; if(d.points.length<need) return;
    const pts=d.points.slice();
    S.editor={type:"mark",kind:d.kind,points:pts,data:{activity:S.lastAct,date:S.year===NOW.getFullYear()?todayStr():"",unit:unitAt(pts),detail:"",result:"",remind:"",notes:""}};
  }
  endDraw();renderPanel();
  const f=$("f_name")||$("f_act"); if(f) f.focus();
}
function selectMark(id){
  const m=S.marks.find(x=>x.id===id);
  if(!m){S.sel=null;S.editor=null}else{S.sel={t:"mark",id};S.editor={type:"mark",id,kind:m.kind,points:m.points,data:{activity:m.activity,date:m.date||"",unit:m.unit||"",detail:m.detail||"",result:m.result||"",notes:m.notes||""}}}
  renderMap();renderPanel();
}
function selectUnit(id){
  const u=S.units.find(x=>x.id===id);
  if(!u){S.sel=null;S.editor=null}else{S.sel={t:"unit",id};S.editor={type:"unit",id,points:u.points,data:{name:u.name}}}
  renderMap();renderPanel();
}
function onMapClick(pt){
  const d=S.draft;
  if(S.tool==="select"||!d){ if(S.sel||S.editor){S.sel=null;S.editor=null;renderMap();renderPanel()} return }
  const now=Date.now(), last=d.last||{t:0,p:null};
  const px=p=>map.latLngToContainerPoint(p), near=(a,b,tol)=>a&&b&&px(a).distanceTo(px(b))<tol;
  if(d.kind==="poly"&&d.points.length>=3&&near(pt,d.points[0],14)){finishDraft();return}
  if(d.kind!=="point"&&d.points.length>=(d.kind==="poly"?3:2)&&now-last.t<350&&near(pt,last.p,8)){finishDraft();return}
  d.points.push(pt); d.last={t:now,p:pt};
  if(d.kind==="point"){finishDraft();return}
  renderDraft();renderHint();
}
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.key==="Escape"){ if(S.tool!=="select"){endDraw();renderPanel()} else if(S.sel||S.editor){S.sel=null;S.editor=null;renderMap();renderPanel()} }
  else if(e.key==="Enter"&&S.draft) finishDraft();
  else if((e.key==="Backspace"||e.key==="z")&&S.draft&&S.draft.points.length){S.draft.points.pop();renderDraft();renderHint()}
});

/* ---------- UI events ---------- */
$("tools").addEventListener("click",e=>{const b=e.target.closest("[data-tool]");if(b)setTool(b.dataset.tool===S.tool?"select":b.dataset.tool)});
$("hint").addEventListener("click",e=>{
  const b=e.target.closest("[data-h]"); if(!b) return; const a=b.dataset.h;
  if(a==="finish") finishDraft();
  else if(a==="undo"&&S.draft&&S.draft.points.length){S.draft.points.pop();renderDraft();renderHint()}
  else if(a==="cancel"){S.editor=null;endDraw();renderPanel()}
});
L.DomEvent.disableClickPropagation($("tools"));L.DomEvent.disableClickPropagation($("hint"));
$("years").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.add){
    const ys=years(), ny=Math.max(...ys)+1;
    S.year=ny;S.extraYears.push(ny);S.sel=null;S.editor=null;
    guard(()=>saveCfg({years:[...new Set([...(S.cfg&&S.cfg.years||[]),...ys,ny])].sort()}));
    renderAll();
  }else if(b.dataset.y){S.year=+b.dataset.y;S.sel=null;S.editor=null;if(S.tool!=="select")endDraw();renderAll()}
});
const quietTool=()=>{if(S.tool!=="select"){S.draft=null;S.tool="select";cursor=null;renderTools();renderHint()}};
$("panel").addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"); if(f){const k=f.dataset.f;S.hidden.has(k)?S.hidden.delete(k):S.hidden.add(k);renderMap();renderPanel();return}
  const r=e.target.closest("[data-row]"); if(r){quietTool();selectMark(r.dataset.row);const m=S.marks.find(x=>x.id===r.dataset.row);if(m)map.fitBounds(L.latLngBounds(m.points),{maxZoom:18,padding:[60,60]});return}
  const u=e.target.closest("[data-urow]"); if(u){quietTool();selectUnit(u.dataset.urow);const un=S.units.find(x=>x.id===u.dataset.urow);if(un)map.fitBounds(L.latLngBounds(un.points),{maxZoom:18,padding:[60,60]});return}
  const rd=e.target.closest("[data-rdone]"); if(rd){toggleTodo(rd.dataset.rdone);return}
  const re=e.target.closest("[data-redit]"); if(re){setTab("todo");openTodoForm(re.dataset.redit);return}
  const h=e.target.closest("[data-h]"); if(h){mapAction(h.dataset.h);return}
  const x=e.target.closest("[data-e]"); if(!x) return;
  if(x.dataset.e==="cancel"){S.editor=null;S.sel=null;renderMap();renderPanel()} else if(x.dataset.e==="del") doDelete();
});
function mapAction(a){
  if(a==="home"){const c=map.getCenter();guard(async()=>{await saveCfg({home:{lat:c.lat,lng:c.lng,zoom:map.getZoom()}});toast("Home view saved")})}
  else if(a==="gohome"){const hm=S.cfg&&S.cfg.home;if(hm)map.setView([hm.lat,hm.lng],hm.zoom);else toast("No home view saved yet")}
  else if(a==="export"){
    const out={exported:new Date().toISOString(),config:S.cfg,units:S.units.map(u=>({id:u.id,name:u.name,points:toDb(u.points)})),marks:S.marks.map(m=>Object.assign({},m,{points:toDb(m.points)})),reminders:S.reminders,equipment:S.equipment,maintenance:S.maint,notes:S.notes,harvest:S.harvest};
    const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
    const an=document.createElement("a");an.href=url;an.download="orr-map-backup-"+todayStr()+".json";document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }else if(a==="import") $("impfile").click();
  else if(a==="ics") exportIcs();
  else if(a==="addrem"){setTab("todo");openTodoForm()}
  else if(a==="todotab") setTab("todo");
}
$("panel").addEventListener("change",e=>{
  if(e.target.id!=="impfile"||!e.target.files[0]) return;
  const rd=new FileReader();
  rd.onload=()=>guard(async()=>{
    const o=JSON.parse(rd.result); let n=0;
    if(o.config) await store.set("config","map",{years:o.config.years||[],home:o.config.home||null});
    for(const u of o.units||[]){await store.set("units",u.id,{name:u.name,points:u.points});n++}
    for(const m of o.marks||[]){const id=m.id;const c=Object.assign({},m);delete c.id;await store.set("marks",id,c);n++}
    for(const [coll,list] of [["reminders",o.reminders],["equipment",o.equipment],["maintenance",o.maintenance],["notes",o.notes],["harvest",o.harvest]]) for(const x of list||[]){const c=Object.assign({},x);delete c.id;await store.set(coll,x.id,c);n++}
    toast("Imported "+n+" items");
  });
  rd.readAsText(e.target.files[0]); e.target.value="";
});
$("panel").addEventListener("input",e=>{
  const ed=S.editor; if(!ed) return; const id=e.target.id;
  if(ed.type==="mark"){
    if(id==="f_act"){ed.data.activity=e.target.value;S.lastAct=e.target.value;$("f_detail").placeholder=ACTS[e.target.value].ph}
    else if(id==="f_date")ed.data.date=e.target.value;
    else if(id==="f_unit")ed.data.unit=e.target.value;
    else if(id==="f_detail")ed.data.detail=e.target.value;
    else if(id==="f_notes")ed.data.notes=e.target.value;
    else if(id==="f_result")ed.data.result=e.target.value;
    else if(id==="f_remind")ed.data.remind=e.target.value;
  }else if(ed.type==="reminder"){
    if(id==="f_rtitle")ed.data.title=e.target.value;
    else if(id==="f_rdue")ed.data.due=e.target.value;
    else if(id==="f_rcat")ed.data.cat=e.target.value;
    else if(id==="f_runit")ed.data.unit=e.target.value;
  }else if(id==="f_name") ed.data.name=e.target.value;
});
$("panel").addEventListener("submit",e=>{
  e.preventDefault(); const ed=S.editor; if(!ed) return;
  guard(async()=>{
    if(ed.type==="mark"){
      const id=ed.id||store.newId(), old=ed.id&&S.marks.find(m=>m.id===ed.id);
      await store.set("marks",id,{year:old?old.year:S.year,kind:ed.kind,points:toDb(ed.points),activity:ed.data.activity,date:ed.data.date||"",unit:ed.data.unit||"",detail:ed.data.detail||"",result:ed.data.result||"",notes:ed.data.notes||""});
      if(!ed.id&&ed.data.remind){
        await store.set("reminders",store.newId(),{title:ACTS[ed.data.activity].name+" follow-up"+(ed.data.detail?": "+ed.data.detail:""),due:ed.data.remind,cat:ACT_CAT[ed.data.activity]||"other",unit:ed.data.unit||"",done:false,markId:id});
      }
      S.editor=null;S.sel=null;renderMap();renderPanel();toast("Entry saved");
    }else if(ed.type==="reminder"){
      const ttl=(ed.data.title||"").trim(); if(!ttl){toast("Say what needs doing");return}
      if(!ed.data.due){toast("Pick a due date");return}
      await store.set("reminders",ed.id||store.newId(),{title:ttl,due:ed.data.due,cat:ed.data.cat||"other",unit:ed.data.unit||"",done:!!ed.data.done,markId:ed.data.markId||""});
      S.editor=null;S.sel=null;renderPanel();toast("Reminder saved");
    }else{
      const name=(ed.data.name||"").trim(); if(!name){toast("Give the unit a name");return}
      await store.set("units",ed.id||store.newId(),{name,points:toDb(ed.points)});
      S.editor=null;S.sel=null;renderMap();renderPanel();toast("Unit saved");
    }
  });
});
function doDelete(){
  const ed=S.editor; if(!ed||!ed.id) return;
  guard(async()=>{await store.del(ed.type==="unit"?"units":ed.type==="reminder"?"reminders":"marks",ed.id);S.editor=null;S.sel=null;renderMap();renderPanel();toast("Deleted")});
}

/* ---------- boot ---------- */
async function boot(){
  renderAll();
  if(fbReady){
    try{await Cloud.init();store=Cloud;S.mode="cloud"}
    catch(e){console.error(e);toast("Could not connect to Firebase ("+(e.code||e.message)+"). Using demo mode.")}
  }
  if(store===Local) await Local.init();
  let first=true;
  store.watch("config",docs=>{
    const d=docs.find(x=>x.id==="map"); S.cfg=d||null;
    if(first&&d&&d.home){map.setView([d.home.lat,d.home.lng],d.home.zoom)} first=false;
    renderYears();
  });
  store.watch("units",docs=>{S.units=docs.map(d=>({id:d.id,name:d.name,points:fromDb(d.points)}));renderMap();renderPanel()});
  store.watch("reminders",docs=>{S.reminders=docs;renderPanel();softPage()});
  store.watch("equipment",docs=>{S.equipment=docs;softPage()});
  store.watch("maintenance",docs=>{S.maint=docs;softPage()});
  store.watch("notes",docs=>{S.notes=docs;softPage()});
  store.watch("harvest",docs=>{S.harvest=docs;softPage()});
  store.watch("marks",docs=>{
    S.marks=docs.map(d=>Object.assign({},d,{points:fromDb(d.points)}));
    if(S.sel&&S.sel.t==="mark"&&!S.marks.find(m=>m.id===S.sel.id)){S.sel=null;S.editor=null}
    renderYears();renderMap();renderPanel();
  });
  renderPanel();
}
boot();
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
